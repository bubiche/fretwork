server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress the text payloads. Deliberately NOT the soundfonts: .sf3 is already Ogg-compressed
    # and .sf2 is raw samples that barely shrink, so gzipping 19 MB of them is wasted CPU per hit.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json
                     image/svg+xml application/wasm;

    # These are regex locations (not prefix ones) so they keep working for a subpath build, where
    # the bundle sits under e.g. /fretwork/ instead of the root. First match wins, so order matters.

    # Vite fingerprints everything under assets/, so it can be cached forever. This rule trusts that
    # invariant — don't add an unhashed `public/assets/` directory, or it would be pinned in browser
    # caches for a year with no way to bust it.
    location ~* /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must never be cached, or a new build stays invisible to returning visitors.
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache";
    }

    # Everything else is copied verbatim from public/ (soundfonts, fonts, sample tabs, the model
    # weights + its manifest) and keeps its filename across releases, so it must stay revalidated —
    # otherwise a returning visitor is stuck on the old copy forever.
    #
    # Deliberately the catch-all rather than an extension allowlist: anything not listed would get
    # no Cache-Control at all and fall through to the browser's heuristic freshness, which is
    # derived from Last-Modified age and so differs per file. That's the dangerous case for the
    # transcribe model — model.json and its weights shard must share a lifetime, or a cache could
    # pair a stale manifest with fresh weights. A uniform max-age keeps them in step (they're
    # fetched together, so they expire together); it doesn't stop both being up to an hour behind,
    # which is fine. A hard reload bypasses it if you've just swapped an asset.
    location / {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
